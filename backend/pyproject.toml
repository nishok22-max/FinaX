[project]
name = "liquidation-shield-backend"
version = "0.1.0"
description = "Python/FastAPI keeper backend for the Automated Liquidation Shield & Flash-Repayment Vault (PS-11)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "web3>=6.20",
    "eth-account>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# The agentic layer (app/agent) is an OPTIONAL extra, deliberately kept out of `dependencies`.
# The keeper must install, boot, and pass its whole suite with none of this present — the agent
# is an orchestration/explanation layer over the deterministic pipeline, never a requirement of it.
agent = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.6.1,<2",
    "langchain-google-genai>=4.3,<5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run. web3 caches its aiohttp session per (loop, endpoint) and
# never closes it, so a loop per test leaks an "Unclosed client session" for every chain call.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "error",
    # Starlette's TestClient still imports httpx 0.x; nothing to fix on our side until it moves.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # uvicorn[standard] pulls in websockets.legacy at import time.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true

# The agent stack ships partial/absent stubs and is an optional extra, so it may not be
# installed at all when mypy runs. Neither case should fail a strict check of our own code.
[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "langchain_google_genai.*"]
ignore_missing_imports = true
